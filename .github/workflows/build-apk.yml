# ====================================================================
# Aevion APK builder — runs in GitHub-hosted runners so you can
# download a fresh Aevion.apk without your PC's toolchain.
# Triggered on every push to main, and any PR touching it, plus manual.
# ====================================================================
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Aevion.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 1. Repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. ubuntu-latest already ships a JDK + the Android SDK; we pin them
      #    explicitly so a runner image change cannot alter the toolchain.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      #    Node 22 is not optional: android-wrapper/package-lock.json pins
      #    @capacitor/cli 8.5.2, whose package.json says engines.node = ">=22.0.0".
      #    npm only WARNS about a bad engine, so on Node 20 the install step
      #    "succeeded" and the very next step (cap sync) died in about a second,
      #    on every single run. The version lives in .nvmrc so CI and a
      #    developer's machine cannot drift apart.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: android-wrapper/package-lock.json

      - name: Configure env vars
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Node: $(command -v node) $(node --version)"
          echo "Java: $(command -v java) $(java --version 2>&1 | head -1)"
          echo "npm: $(npm --version || echo 'not present (will install via npm install)')"

          # Fail here, with the reason spelled out, instead of letting the
          # Capacitor CLI explode anonymously one step later.
          node -e '
            const lock = require("./android-wrapper/package-lock.json");
            const want = lock.packages["node_modules/@capacitor/cli"].engines.node;
            const major = Number(process.versions.node.split(".")[0]);
            const min = Number((want.match(/\d+/) || [0])[0]);
            console.log(`capacitor cli needs node ${want}; this runner has ${process.versions.node}`);
            if (major < min) {
              console.error(`FAIL: node ${process.versions.node} cannot run the Capacitor CLI (needs ${want}). Fix .nvmrc.`);
              process.exit(1);
            }
            console.log("PASS: the runner satisfies the Capacitor CLI engine requirement");
          '

          # Publish the toolchain to the job summary. The run log needs admin
          # rights to fetch through the API, but the summary does not — so a
          # failure can be diagnosed from anywhere instead of guessing at an
          # empty "exit code 1".
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### Runner toolchain"
              echo ''
              echo '```'
              echo "node:         $(node --version)"
              echo "java:         $(java -version 2>&1 | head -1)"
              echo "ANDROID_HOME: $ANDROID_HOME"
              echo "platforms:    $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
              echo "build-tools:  $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 3. Install the Capacitor toolchain into android-wrapper/
      - name: Install Capacitor dependencies
        working-directory: ./android-wrapper
        run: npm install --prefer-offline

      # 4. Copy the Aevion web app into www/ (exactly what a fresh clone needs)
      - name: Copy web assets into www
        run: |
          rm -rf android-wrapper/www
          mkdir -p android-wrapper/www
          cp -r aevion/. android-wrapper/www/
          rm -f android-wrapper/www/serve.ps1 android-wrapper/www/serve.bat

      # 5. Sync the Capacitor native project with the web app.
      #    Runs through the LOCAL cli (node node_modules/@capacitor/cli/bin/capacitor)
      #    and keeps the runner's ANDROID_HOME/JAVA_HOME untouched: an earlier
      #    version overrode both with empty strings via ${{ env.ANDROID_HOME }}
      #    (unset at workflow level), and npx cap then failed in about a second
      #    on every push. npm install already put the cli in node_modules.
      - name: Sync Capacitor native project
        working-directory: ./android-wrapper
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      # 6. Build the APK using the repo's Gradle wrapper — never the runner's global Gradle
      #    `gradlew` is a shell script, so it has to be executable. This repo was
      #    authored on Windows, where git commonly records it in the index as
      #    100644; a Linux runner then answers "Permission denied" and the step
      #    dies in about a second. The index bit is fixed too (mode 100755) —
      #    this chmod is the belt to that braces, because an exec bit is easy to
      #    lose again and impossible to notice on Windows.
      - name: Build Aevion debug APK
        working-directory: ./android-wrapper
        run: |
          cd android
          chmod +x gradlew

          # A failing Gradle build prints its reason to a log nobody can read
          # (the run log needs admin rights through the API). Tee it, and put
          # the tail in the job summary, which is readable — so the next CI
          # failure arrives with its own explanation.
          set +e
          set -o pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2g" 2>&1 | tee gradle-build.log
          status=$?
          set +o pipefail

          if [ "$status" -ne 0 ]; then
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              {
                echo "### Gradle failed (exit $status)"
                echo ''
                echo '```'
                tail -n 60 gradle-build.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$status"
          fi

      # 7. Upload the APK as a downloadable artifact (Gatehouse keeps it to you)
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aevion-debug
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      # 8. Sanity-check that the native plugin actually shipped — catches
      #    any silent drop before you spend time downloading.
      - name: Verify the build APK contains the native plugin
        if: success()
        working-directory: ./android-wrapper
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          echo "checking the debug APK with the same eyes the release build uses"
          echo "=== verifying the freshly built APK ==="
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          echo "APK size: $(du -h "$APK" | cut -f1)"

          # native plugin classes live in classes.dex — scan them
          unzip -p "$APK" classes.dex > /tmp/classes_dex.bin
          grep -q "SpeechPlugin" /tmp/classes_dex.bin   || { echo "SpeechPlugin not found in classes.dex"; exit 1; }
          grep -q "micPermission"     /tmp/classes_dex.bin   || { echo "micPermission callback not found in classes.dex"; exit 1; }
          echo "PASS: native plugin is inside the APK"

          # manifest carries the permissions + the speech <queries> entry
          unzip -p "$APK" AndroidManifest.xml | grep -q "RECORD_AUDIO" || { echo "RECORD_AUDIO missing from manifest"; exit 1; }
          unzip -p "$APK" AndroidManifest.xml | grep -q "android.speech.RecognitionService" || { echo "speech <queries> entry missing from manifest"; exit 1; }
          echo "PASS: manifest carries RECORD_AUDIO + speech queries"

          # web assets are the current version (ver bump in index.html = 068)
          unzip -p "$APK" assets/public/index.html | grep -q '?v=068' || { echo "index.html not at v=068 - likely stale"; exit 1; }
          echo "PASS: web assets are the current version"

          # the event-payload fix is really in packaged core.js
          unzip -p "$APK" assets/public/js/core.js | grep -q 'e && e.detail' || { echo "event-payload fix missing from core.js"; exit 1; }
          echo "PASS: event-payload fix is in core.js"

          # every feature module really made it into the packaged web app
          for f in js/providers.js js/tools.js js/memory.js; do
            unzip -p "$APK" "assets/public/$f" | grep -q 'Aevion' || { echo "$f missing from the APK"; exit 1; }
          done
          echo "PASS: providers, tools and memory modules are packaged"

          echo "=== verification complete — APK is safe to download ==="

      # 9. Encrypt the verbose build log with the symmetric key stored as a repo
      #    secret, and upload it as a second artifact next to the APK. The log is
      #    useless without the key, so the repo secret is the gate. If the secret is
      #    not set yet, skip this step with a warning rather than failing the build.
      #
      #    Decrypt locally:
      #      openssl enc -aes-256-cbc -d -base64 -in Aevion-build-log.enc -out build.log \
      #        -pass pass:$(cat AEVION_LOG_KEY)
      #    where AEVION_LOG_KEY is the value you store in the repo's secret store.
      #    (The secret is never present in the YAML; the runner binds it at runtime.)
      - name: Encrypt and upload the build log
        if: always()
        env:
          LOG_KEY: ${{ secrets.AEVION_LOG_KEY }}
        run: |
          set -euo pipefail
          LOG="build.log"
          ENC="Aevion-build-log.enc"

          echo "=== Aevion build log — run $GITHUB_RUN_ID (ID=$GITHUB_RUN_NUMBER) ===" > "$LOG"
          echo "branch=$GITHUB_REF_NAME  sha=$GITHUB_SHA" >> "$LOG"
          echo "workflow=$GITHUB_WORKFLOW  event=$GITHUB_EVENT_NAME" >> "$LOG"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"
          echo "" >> "$LOG"

          if [ -n "$LOG_KEY" ]; then
            openssl enc -aes-256-cbc -base64 -salt -pbkdf2 -pass pass:"$LOG_KEY" -in "$LOG" -out "$ENC"
            echo "encrypted $LOG -> $ENC (key present)"
          else
            echo "WARNING: AEVION_LOG_KEY not set in the repo secrets — skipping encryption."
            echo "TIP: store a random AES-256 key via Actions secrets as AEVION_LOG_KEY."
            echo "The build still succeeds; the log artifact will not be uploaded."
            exit 0
          fi

      # 10. Ship the encrypted log artifact alongside the APK so it is trivial to
      #     download — the encryption is the gate, not who can see the workflow run.
      - name: Upload encrypted build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aevion-build-log.enc
          path: Aevion-build-log.enc
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
