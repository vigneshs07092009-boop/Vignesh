apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties.
// If that file is absent the release build simply stays unsigned, so the
// debug workflow keeps working on machines that have no release key.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ---------------------------------------------------------------------------
// Version numbers come from the web app itself (js/core.js -> Aevion.version),
// so an APK can never advertise a version it does not actually contain.
//
// The packaged copy wins over the www/ source: it is the code that really ends
// up inside the APK. If you forget to re-sync the web app, the version tells
// you the APK is the older one instead of silently lying.
//
// versionCode is derived so it only ever grows:  0.5.0 -> 5000, 0.5.1 -> 5001,
// 1.0.0 -> 1000000. Android rejects installs whose versionCode goes backwards,
// which is why this is computed rather than hand-typed.
// ---------------------------------------------------------------------------

def webCoreFile = [
    file("${projectDir}/src/main/assets/public/js/core.js"),
    file("${rootProject.projectDir}/../www/js/core.js")
].find { it.exists() }

def webVersionName = '1.0'
def webVersionCode = 1

if (webCoreFile != null) {
    def versionMatcher = (webCoreFile.text =~ /version:\s*'(\d+)\.(\d+)\.(\d+)/)
    if (versionMatcher.find()) {
        def major = versionMatcher.group(1) as int
        def minor = versionMatcher.group(2) as int
        def patch = versionMatcher.group(3) as int
        webVersionName = "${major}.${minor}.${patch}"
        webVersionCode = major * 1000000 + minor * 1000 + patch
    } else {
        logger.warn("Aevion: could not read a version from ${webCoreFile} - using ${webVersionName}/${webVersionCode}")
    }
} else {
    logger.warn("Aevion: no web app copy found to read a version from - using ${webVersionName}/${webVersionCode}")
}

logger.lifecycle("Aevion version: ${webVersionName} (versionCode ${webVersionCode})")

android {
    namespace = "com.aevion.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aevion.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode webVersionCode
        versionName webVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storeType keystoreProperties['storeType']
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // Sign with every scheme: v1 for old Android, v2 for 7.0+,
                // v3 so the key can be rotated later without reinstalling.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
